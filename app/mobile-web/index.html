<!doctype html>
<html lang="zh-CN" data-workspace-ui>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>NAW</title>
  <link rel="stylesheet" href="/mobile/style.css">
  <script src="/mobile/client.js" defer nonce="__NAW_SCRIPT_NONCE__"></script>
  <script src="/mobile/workspace.js" defer nonce="__NAW_SCRIPT_NONCE__"></script>
</head>
<body>
  <a class="skip-link" href="#content" id="skip">跳到内容</a>
  <div class="shell">
    <header class="top" id="top"></header>
    <div class="proto" id="connection"></div>
    <main class="main" id="content" tabindex="-1"></main>
  </div>
  <form class="compose" id="compose" action="/mobile/send" method="post" hidden></form>
  <nav class="nav" id="navigation" aria-label="NAW" hidden></nav>
  <dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-close">关闭</button></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
